<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="carbonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0C0D" />
      <stop offset="50%" stop-color="#111314" />
      <stop offset="100%" stop-color="#17191A" />
    </linearGradient>
    <linearGradient id="champagneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D2BE91" />
      <stop offset="50%" stop-color="#C6AD7A" />
      <stop offset="100%" stop-color="#B69A63" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#B69A63" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Dark Luxury Background with subtle bevel -->
  <rect width="192" height="192" rx="44" fill="url(#carbonBg)" stroke="#252829" stroke-width="2" />
  
  <!-- Outer Gold Ring -->
  <circle cx="96" cy="96" r="54" fill="none" stroke="url(#champagneGold)" stroke-width="6" filter="url(#goldGlow)" />
  
  <!-- Inner Subtle Accent Ring -->
  <circle cx="96" cy="96" r="42" fill="none" stroke="#252829" stroke-width="1.5" stroke-dasharray="4 4" />
  
  <!-- Center Monogram "O" -->
  <text x="96" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="url(#champagneGold)" text-anchor="middle" letter-spacing="1">O</text>
  
  <!-- Top Accent Dot -->
  <circle cx="96" cy="34" r="3.5" fill="#D2BE91" />
</svg>
